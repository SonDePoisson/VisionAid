# Fabrique les applications installables de VisionAId : .dmg (macOS), installateur .exe
# (Windows), .AppImage (Linux). Lancé à la main (onglet Actions → « Run workflow ») ou en
# poussant une étiquette de version (git tag v0.1.0 && git push origin v0.1.0) : dans ce cas les
# fichiers sont aussi joints à une « release » GitHub (brouillon, à publier à la main).
name: Applications

on:
  workflow_dispatch:
  push:
    tags: ["v*"]

permissions:
  contents: read

concurrency:
  group: applications-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        include:
          # torch ne fournit plus de roues pour les Mac Intel : Apple Silicon seulement
          - { name: macOS (Apple Silicon), os: macos-14, exe: dist/VisionAId.app/Contents/MacOS/VisionAId, files: "dist/*.dmg" }
          - { name: Windows (x64), os: windows-2022, exe: dist/VisionAId/VisionAId.exe, files: "dist/*-setup.exe\ndist/*-portable.zip" }
          - { name: Linux (x86_64), os: ubuntu-22.04, exe: dist/VisionAId/VisionAId, files: "dist/*.AppImage\ndist/*.tar.gz" }
    env:
      PYTHONUTF8: "1"
      UV_NO_SYNC: "1"
      HAS_MAC_CERT: ${{ secrets.MACOS_CERTIFICATE != '' }}
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.12"
          enable-cache: true

      - name: Dépendances (macOS, Windows)
        if: runner.os != 'Linux'
        run: uv sync --frozen --no-dev --group package

      # Linux : torch par défaut embarque CUDA (~3 Go) ; l'application tourne sur le processeur,
      # on installe donc les roues « cpu » de PyTorch aux mêmes versions que uv.lock.
      - name: Dépendances (Linux, torch sans CUDA)
        if: runner.os == 'Linux'
        run: |
          uv export --frozen --no-dev --group package --no-hashes --no-emit-project \
            --format requirements-txt -o req.txt
          grep -vE '^(nvidia-|cuda-|triton)' req.txt \
            | sed -E 's/^(torch|torchvision)==([0-9.]+)/\1==\2+cpu/' > req-cpu.txt
          grep -E '^(torch|torchvision)==' req-cpu.txt
          uv venv --python 3.12
          uv pip install -r req-cpu.txt \
            --extra-index-url https://download.pytorch.org/whl/cpu --index-strategy unsafe-best-match
          wget -q -O appimagetool \
            https://github.com/AppImage/appimagetool/releases/download/continuous/appimagetool-x86_64.AppImage
          chmod +x appimagetool
          echo "APPIMAGETOOL=$PWD/appimagetool" >> "$GITHUB_ENV"

      - name: Inno Setup (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          if (-not (Test-Path "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe")) { choco install innosetup -y --no-progress }

      # Signature et notarisation Apple : seulement si les secrets existent (sinon application
      # signée « ad hoc » : ouverture par clic droit → Ouvrir au premier lancement).
      - name: Certificat Apple
        if: runner.os == 'macOS' && env.HAS_MAC_CERT == 'true'
        env:
          MACOS_CERTIFICATE: ${{ secrets.MACOS_CERTIFICATE }}
          MACOS_CERTIFICATE_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
        run: |
          echo "$MACOS_CERTIFICATE" | base64 --decode > cert.p12
          security create-keychain -p ci build.keychain
          security default-keychain -s build.keychain
          security unlock-keychain -p ci build.keychain
          security set-keychain-settings -lut 7200 build.keychain
          security import cert.p12 -k build.keychain -P "$MACOS_CERTIFICATE_PASSWORD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k ci build.keychain
          rm cert.p12

      - name: Fabrication
        env:
          MACOS_CODESIGN_IDENTITY: ${{ secrets.MACOS_CODESIGN_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_APP_PASSWORD: ${{ secrets.APPLE_APP_PASSWORD }}
        run: uv run python packaging/build.py

      - name: Test de fumée (démarrage, guidage factice, arrêt)
        run: python packaging/smoke_test.py ${{ matrix.exe }}

      - uses: actions/upload-artifact@v4
        with:
          name: VisionAId-${{ runner.os }}
          path: ${{ matrix.files }}
          if-no-files-found: error
          compression-level: 0

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          draft: true
          generate_release_notes: true
          files: artifacts/*
