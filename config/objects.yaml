# Objets courants qu'on peut demander à la voix, en plus des fiches de config/targets/.
#
# Une fiche (gourde, clés) l'emporte toujours : elle a des photos de référence et des réglages
# calibrés. Pour un objet de cette liste, le détecteur cherche les mots anglais `en` et
# toute détection assez sûre est la cible (pas de photos : deux télécommandes se confondent).
# Déposer des photos data/ref/<nom>_*.jpg suffit pour reconnaître SON objet.
#
#   dit  : nom prononcé dans les annonces, avec son article (« la télécommande »)
#   mots : façons de le dire (le nom lui-même est déjà compris via `dit`)
#   en   : mots du détecteur (anglais)
#   fem  : féminin, à préciser seulement après « l' » ou « les »
#   conf : confiance minimale de détection (défaut : 0.30)

