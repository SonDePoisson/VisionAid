# Fiche cible : trousseau de clés (petit, métallique, forme variable : objet difficile)
name: cles
label: mes clés
phrases:
  - où sont mes clés
  - mes clés
  - clés
  - clefs
  - mes clefs
  - trousseau
  - trouve mes clés
overrides:
  target:
    name: cles
    height_m: null          # pas de contrôle d'échelle par la taille de l'objet
  detector:
    text_prompts: ["keys", "bunch of keys", "key ring", "keychain"]
    negative_prompts: ["phone", "remote control", "wallet", "pen", "coin", "bag", "cup"]
    conf: 0.08              # objet petit : seuil de détection abaissé, la ReID filtre ensuite
  paths:
    ref_glob: "cles_*.jpg"
  reid:
    color_model: none       # pas de couleur distinctive fiable (métal, reflets)
    w_embed: 1.0
    w_color: 0.0
    threshold_file: config/reid_threshold_cles.yaml
    textonly_conf: 0.25     # sans photo de référence : confiance minimale de détection
