<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>VisionAId — capteur</title>
<style>
  :root { --bg:#111; --fg:#f2f2f2; --muted:#9a9a9a; --ok:#3ccf6e; --warn:#f0b429; --err:#ff5c5c; --accent:#ff8a1f; }
  * { box-sizing:border-box; }
  html,body { margin:0; background:var(--bg); color:var(--fg); font:16px/1.4 -apple-system,system-ui,sans-serif; }
  main { padding:16px; max-width:640px; margin:0 auto; }
  h1 { font-size:20px; margin:0 0 8px; }
  button { font:inherit; border:0; border-radius:14px; padding:18px; width:100%; margin:8px 0; color:#111; background:var(--accent); font-weight:600; font-size:20px; }
  button.secondary { background:#2a2a2a; color:var(--fg); font-size:16px; padding:12px; }
  button:disabled { opacity:.4; }
  #status { font-weight:600; margin:8px 0; }
  .ok { color:var(--ok); } .warn { color:var(--warn); } .err { color:var(--err); }
  .grid { display:grid; grid-template-columns:1fr 1fr; gap:6px 12px; margin:12px 0; }
  .grid div { background:#1c1c1c; border-radius:10px; padding:8px 10px; }
  .grid b { display:block; font-size:22px; }
  .grid span { color:var(--muted); font-size:13px; }
  video { width:100%; max-height:40vh; object-fit:contain; background:#000; border-radius:10px; }
  #level { position:relative; height:44px; background:#1c1c1c; border-radius:10px; margin:8px 0; overflow:hidden; }
  #bubble { position:absolute; top:8px; width:28px; height:28px; border-radius:50%; background:var(--ok); left:calc(50% - 14px); transition:left .1s; }
  #level::after { content:""; position:absolute; left:50%; top:0; bottom:0; border-left:2px dashed #555; }
  #levelText { color:var(--muted); font-size:13px; }
  .row { display:flex; gap:8px; } .row button { flex:1; }
  label { display:flex; gap:8px; align-items:center; margin:8px 0; }
  textarea { width:100%; background:#1c1c1c; color:var(--fg); border:0; border-radius:10px; padding:8px; font:inherit; }
  #log { color:var(--muted); font-size:12px; white-space:pre-wrap; max-height:120px; overflow:auto; }
</style>
</head>
<body>
<main>
  <h1>VisionAId — capteur</h1>
  <div id="status">Prêt. Fixez le téléphone sur le torse, écran vers vous, puis appuyez sur Démarrer.</div>
  <button id="start">Démarrer</button>
  <div class="grid">
    <div><b id="fps">–</b><span>images/s reçues par le PC</span></div>
    <div><b id="imu">–</b><span>IMU (Hz) reçue</span></div>
    <div><b id="rtt">–</b><span>aller-retour (ms)</span></div>
    <div><b id="age">–</b><span>âge des images (ms)</span></div>
  </div>
  <div id="level"><div id="bubble"></div></div>
  <div id="levelText">Niveau : téléphone vertical attendu (bulle au centre).</div>
  <video id="video" playsinline muted autoplay></video>
  <label><input type="checkbox" id="calibMode"> Mode calibration (damier)</label>
  <div class="row">
    <button id="capture" class="secondary" disabled>Capturer une vue</button>
    <button id="stop" class="secondary" disabled>Arrêter</button>
  </div>
  <textarea id="notes" rows="2" placeholder="Notes pour la session (chauffe, coupures, gêne du support…)"></textarea>
  <button id="sendNotes" class="secondary" disabled>Envoyer les notes</button>
  <div id="log"></div>
</main>
<script src="/static/app.js"></script>
</body>
</html>
